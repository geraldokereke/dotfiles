# Oxocarbon + minimal tmux (256-color + truecolor for hex status colors)
# Reload: prefix + r  or  tmux source-file ~/.config/tmux/tmux.conf
#
# Outside tmux, use TERM=xterm-256color (or your terminal's 256-color name).
# Inside tmux panes, TERM is set to tmux-256color automatically.

set -g default-terminal "tmux-256color"

# 256 indexed colors + 24-bit truecolor (Tc) through the stack
set -as terminal-overrides ",xterm-256color:colors=256"
set -as terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ",tmux-256color:colors=256"
set -as terminal-overrides ",tmux-256color:RGB"
set -as terminal-overrides ",tmux-256color:Tc"
set -as terminal-overrides ",screen-256color:colors=256"
set -as terminal-overrides ",*:Tc"

set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 0
set -g history-limit 50000
set -g mouse on
set -g focus-events on
setw -g mode-keys vi
set -g allow-rename off

# Oxocarbon palette (matches oxocarbon.nvim dark)
# bg #161616  surface #262626  border #393939  muted #525252
# fg #dde1e6  accent #33b1ff  teal #08bdba  magenta #ee5396

set -g status-position top
set -g status-style "bg=#262626,fg=#dde1e6"
set -g status-left-length 24
set -g status-right-length 48
set -g status-left "#[fg=#08bdba,bold]#{session_name}"
set -g status-right "#[fg=#525252]#{?client_prefix,#[fg=#33b1ff]prefix ,}#[fg=#dde1e6]%H:%M"

setw -g window-status-style "bg=#262626,fg=#525252"
setw -g window-status-current-style "bg=#393939,fg=#33b1ff,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

set -g pane-border-style "fg=#393939"
set -g pane-active-border-style "fg=#33b1ff"
set -g message-style "bg=#262626,fg=#dde1e6"
set -g message-command-style "bg=#393939,fg=#33b1ff"

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Seamless navigation with Neovim (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\\\" "select-pane -l"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

bind-key r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Plugins (optional — install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm)
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-resurrect"

run-shell "~/.tmux/plugins/tpm/tpm"
